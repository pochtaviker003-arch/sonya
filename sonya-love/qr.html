<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff4f2" />
  <title>QR-код для Сони ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#fbe4e3,#fff8f5 62%);font-family:Manrope,Arial,sans-serif;color:#432d35;display:flex;align-items:center;justify-content:center;padding:24px}.panel{width:min(560px,100%);background:#fff;border:1px solid #eed8da;padding:42px 36px;text-align:center;box-shadow:0 25px 70px #75465312}.heart{font-size:28px;color:#cc6f83}.kicker{text-transform:uppercase;letter-spacing:.2em;font-size:9px;color:#a65a70;font-weight:800;margin:12px 0 16px}h1{font:500 clamp(34px,7vw,48px)/1.1 'Playfair Display',Georgia,serif;margin:0}h1 em{color:#cc6f83}p{font-size:12px;line-height:1.9;color:#8c727b;margin:17px auto 23px;max-width:400px}label{display:block;text-align:left;font-size:10px;font-weight:800;color:#9a6675;margin:0 0 7px}input{width:100%;border:1px solid #e6c8ce;border-radius:4px;padding:13px 14px;color:#65414d;font:12px Manrope,Arial,sans-serif;outline:none}input:focus{border-color:#bd778a;box-shadow:0 0 0 3px #f8e7e9}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1;border:0;border-radius:30px;padding:13px 12px;background:#a94f68;color:white;font:800 10px Manrope,Arial,sans-serif;cursor:pointer}.actions button.secondary{background:#f8e8e8;color:#995b6e}.qr-wrap{min-height:255px;margin:25px auto 0;display:flex;justify-content:center;align-items:center}.qr-wrap canvas,.qr-wrap img{padding:12px;background:#fff;border:1px solid #f0dcdf;max-width:100%;height:auto!important}.hint{font-size:10px;margin-top:17px;color:#a58b93}.back{display:inline-block;margin-top:16px;color:#a45b71;font-size:10px;text-decoration:none;border-bottom:1px solid #e3bdc5;padding-bottom:4px}
  </style>
</head>
<body>
  <main class="panel">
    <div class="heart">♥</div>
    <div class="kicker">маленький ключ к большой любви</div>
    <h1>QR-код для <em>Сони</em></h1>
    <p>После публикации сайта ссылка подставится автоматически. Нажми «Создать QR-код», а затем скачай картинку и распечатай или отправь её Соне.</p>
    <label for="siteUrl">Ссылка на опубликованный сайт</label>
    <input id="siteUrl" type="url" placeholder="https://username.github.io/sonya-love/" />
    <div class="actions"><button id="generate" type="button">Создать QR-код</button><button class="secondary" id="download" type="button">Скачать PNG</button></div>
    <div class="qr-wrap" id="qrcode"><span class="hint">Здесь появится твой QR-код ♡</span></div>
    <div class="hint">Ссылка должна начинаться с https:// и открываться у Сони.</div>
    <a class="back" href="index.html">← вернуться на сайт</a>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const urlInput = document.getElementById('siteUrl');
    const qrBox = document.getElementById('qrcode');
    let qr;
    // На GitHub Pages адрес берётся автоматически из текущего пути проекта.
    urlInput.value = new URL('./', window.location.href).href;
    function generate() {
      const value = urlInput.value.trim();
      try {
        const parsed = new URL(value);
        if (!['https:', 'http:'].includes(parsed.protocol)) throw new Error('bad protocol');
        qrBox.innerHTML = '';
        qr = new QRCode(qrBox, { text: parsed.href, width: 220, height: 220, colorDark: '#432d35', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
      } catch (error) {
        alert('Проверь ссылку. Она должна начинаться с https://');
      }
    }
    document.getElementById('generate').addEventListener('click', generate);
    document.getElementById('download').addEventListener('click', () => {
      const canvas = qrBox.querySelector('canvas');
      const image = qrBox.querySelector('img');
      let dataUrl = canvas ? canvas.toDataURL('image/png') : (image ? image.src : null);
      if (!dataUrl) { alert('Сначала создай QR-код ♡'); return; }
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = 'qr-dlya-soni.png';
      link.click();
    });
    if (window.QRCode) generate();
    else window.addEventListener('load', () => { if (window.QRCode) generate(); });
  </script>
</body>
</html>
